<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение в кино для Анар</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('https://overclockers.ru/st/legacy/blog/279720/743580_O.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .heading-font { font-family: 'Outfit', sans-serif; }
        .glass-card {
            background: rgba(11, 15, 28, 0.65);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .floating-effect { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

    <div class="absolute inset-0 bg-black/30 z-0"></div>

    <div class="relative z-10 max-w-md w-full glass-card rounded-3xl p-6 sm:p-8 text-white text-center floating-effect">

        <div class="inline-flex items-center gap-2 bg-gradient-to-r from-red-600 to-pink-600 text-xs font-bold uppercase px-4 py-1.5 rounded-full mb-4 tracking-wider shadow-lg shadow-pink-600/40">
            <span>💖</span> Секретное приглашение
        </div>

        <h2 class="text-base text-gray-200 font-medium mb-1 drop-shadow">
            Для моей самой прекрасной
        </h2>

        <h1 class="text-4xl sm:text-5xl font-black text-pink-400 heading-font tracking-wide drop-shadow-[0_2px_15px_rgba(244,114,182,0.8)] mb-5">
            АНАР
        </h1>

        <div class="bg-black/40 backdrop-blur-md p-5 rounded-2xl border border-red-500/40 mb-6 shadow-inner">
            <p class="text-xs uppercase tracking-widest text-cyan-300 font-semibold mb-1">
                Премьера вечера
            </p>
            <h3 class="text-2xl sm:text-3xl font-extrabold heading-font text-yellow-400 drop-shadow-[0_2px_10px_rgba(250,204,21,0.6)]">
                «Человек-паук: Новый день»
            </h3>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-black/40 backdrop-blur-md p-3.5 rounded-xl border border-white/10 flex flex-col items-center justify-center">
                <span class="text-gray-300 text-xs uppercase font-medium mb-0.5">
                    Дата
                </span>
                <span class="text-lg font-bold text-white tracking-wide">
                    12.08.2026
                </span>
            </div>

            <div class="bg-black/40 backdrop-blur-md p-3.5 rounded-xl border border-white/10 flex flex-col items-center justify-center">
                <span class="text-gray-300 text-xs uppercase font-medium mb-0.5">
                    Дресс-код
                </span>
                <span class="text-lg font-bold text-pink-300">
                    Улыбка
                </span>
            </div>
        </div>

        <div class="flex flex-row gap-3 justify-center items-center relative min-h-[55px]" id="button-container">

            <button onclick="acceptInvite()" class="flex-1 bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white font-bold py-3.5 px-3 rounded-xl shadow-lg shadow-emerald-900/50 transition-all transform hover:scale-105 active:scale-95 flex items-center justify-center gap-1.5 cursor-pointer text-sm sm:text-base z-20">
                <span>✨ Идем!</span>
            </button>

            <button id="refuse-btn" onmouseover="moveButton()" onclick="moveButton()" ontouchstart="moveButton()" class="flex-1 bg-gradient-to-r from-red-600 to-rose-700 text-white font-bold py-3.5 px-3 rounded-xl shadow-lg shadow-red-900/50 flex items-center justify-center gap-1.5 transition-all duration-150 cursor-pointer text-sm sm:text-base z-30">
                <span>🚫 Никак</span>
            </button>

        </div>

        <div id="success-msg" class="hidden mt-5 p-4 bg-emerald-950/80 backdrop-blur-md border border-emerald-500 rounded-xl text-emerald-200 text-sm sm:text-base animate-pulse shadow-2xl">
            🥰 Ура! Самое лучшее свидание подтверждено! Жду не дождусь нашей встречи, любимая! 🍿❤️
        </div>
    </div>

    <script>
        function acceptInvite() {
            const msg = document.getElementById('success-msg');
            msg.classList.remove('hidden');
            document.querySelector('.glass-card').style.borderColor =
                'rgba(16, 185, 129, 0.6)';
        }

        function moveButton() {
            const btn = document.getElementById('refuse-btn');
            const randomX = (Math.random() - 0.5) * 160;
            const randomY = (Math.random() - 0.5) * 100;
            btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }
    </script>

</body>
</html>
